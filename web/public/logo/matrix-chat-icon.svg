<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1f1c"/>
      <stop offset="1" stop-color="#081512"/>
    </linearGradient>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="104"/>
    </clipPath>
    <linearGradient id="lineGrad" x1="150" y1="0" x2="362" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="nodeGreen" cx="35%" cy="32%" r="70%">
      <stop offset="0" stop-color="#c8fbe4"/>
      <stop offset="1" stop-color="#10b981"/>
    </radialGradient>
    <radialGradient id="nodeBlue" cx="35%" cy="32%" r="70%">
      <stop offset="0" stop-color="#cdedff"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </radialGradient>
    <radialGradient id="nodeCenter" cx="35%" cy="32%" r="70%">
      <stop offset="0" stop-color="#e7fff5"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
    <g stroke="#14322c" stroke-width="1" opacity="0.55">
      <line x1="64" y1="0" x2="64" y2="512"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="192" y1="0" x2="192" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="320" y1="0" x2="320" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
      <line x1="448" y1="0" x2="448" y2="512"/>
    </g>
    <rect x="0" y="0" width="512" height="512" rx="104" fill="none" stroke="#1f4c43" stroke-width="4" opacity="0.6"/>

    <g filter="url(#glow)">
      <path d="M150,160 L150,360" stroke="url(#lineGrad)" stroke-width="15" stroke-linecap="round" fill="none"/>
      <path d="M150,160 L207,212 L256,264" stroke="url(#lineGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M256,264 L305,212 L362,160" stroke="url(#lineGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M362,160 L362,360" stroke="url(#lineGrad)" stroke-width="15" stroke-linecap="round" fill="none"/>
      <circle cx="150" cy="160" r="29" fill="url(#nodeGreen)"/>
      <circle cx="150" cy="360" r="24" fill="url(#nodeGreen)"/>
      <circle cx="207" cy="212" r="19" fill="url(#nodeGreen)"/>
      <circle cx="256" cy="264" r="33" fill="url(#nodeCenter)"/>
      <circle cx="305" cy="212" r="19" fill="url(#nodeBlue)"/>
      <circle cx="362" cy="160" r="29" fill="url(#nodeBlue)"/>
      <circle cx="362" cy="360" r="24" fill="url(#nodeBlue)"/>
    </g>
  </g>
</svg>
